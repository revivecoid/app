name: Build APK (customer app)

# Builds the customer/workshop APK on main. Separate from deploy.yml, which
# publishes the web build to gh-pages.
#
# Signing: android/app/build.gradle.kts reads KEYSTORE_PATH, STORE_PASSWORD,
# KEY_ALIAS and KEY_PASSWORD from the environment. Set them as repository
# secrets (KEYSTORE_BASE64 for the keystore file itself) + optional. Without
# them the build falls back to debug signing, which Play Store rejects.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'website/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-customer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: flutter build apk (customer)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF
          mkdir -p assets
          cp .env assets/.env

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No KEYSTORE_BASE64 secret — building with debug signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "STORE_PASSWORD=$STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build customer APK
        run: flutter build apk --release --flavor customer -t lib/main.dart

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: revive-customer-apk
          path: build/app/outputs/flutter-apk/app-customer-release.apk
          if-no-files-found: error
