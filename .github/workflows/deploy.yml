name: Deploy to GitHub Pages (revive.co.id)

# Quality gates (analyze, test, migration lint, deno check) run in ci.yml.
# This workflow only handles build + publish to gh-pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF
          mkdir -p assets
          cp .env assets/.env

      # Pin Flutter version for reproducible builds
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # Static analysis gate — fail on errors only
      - name: Run Flutter Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # Run tests if test files exist
      - name: Run Flutter Tests
        run: |
          if [ -n "$(find test -name '*_test.dart' 2>/dev/null | head -1)" ]; then
            flutter test
          else
            echo "No test files found, skipping."
          fi

      - name: Build Flutter Web
        run: |
          flutter build web \
            --release \
            --base-href "/app/"

      - name: Assemble Static Site
        run: |
          mkdir -p build/public/app
          cp -R build/web/* build/public/app/
          cp -R website/* build/public/
          if [ -f build/public/app/404.html ]; then cp build/public/app/404.html build/public/404.html; fi

      - name: Copy CNAME to build/public
        run: cp CNAME build/public/CNAME

      - name: Copy .env asset into build
        run: |
          mkdir -p build/public/app/assets
          cp assets/.env build/public/app/assets/.env

      # Deploy to gh-pages branch
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/public
          cname: revive.co.id
