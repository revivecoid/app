name: Keep-alive Render 9router

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping 9router
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer sk-4e80b25787c4d4be-psse16-e91a3949" \
            https://ninerouter-8lml.onrender.com/v1/models)
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: 9router returned $STATUS"
          fi
