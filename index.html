<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  
  <!-- Prevent caching of index.html -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="re_v">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>re_v</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      document.body.innerHTML = '<pre style="color:yellow;background:#8b0000;padding:20px;font-size:13px;white-space:pre-wrap"><b>JS ERROR:</b> ' + msg + '\nSource: ' + src + ':' + line + ':' + col + '\n\n' + (err && err.stack ? err.stack : '(no stack)') + '</pre>';
      return true;
    };
    window.addEventListener('unhandledrejection', function(e) {
      document.body.innerHTML = '<pre style="color:yellow;background:#8b0000;padding:20px;font-size:13px;white-space:pre-wrap"><b>UNHANDLED PROMISE REJECTION:</b>\n' + (e.reason ? (e.reason.stack || e.reason.toString()) : String(e)) + '</pre>';
    });
  </script>
  <script src="flutter_bootstrap.js?v=9999" async></script>
</body>
</html>
