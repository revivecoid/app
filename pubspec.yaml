name: re_v
description: A new Flutter project for re-V Body Repair.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.4
  go_router: ^14.1.4
  flutter_riverpod: ^2.5.1
  flutter_image_compress: ^2.3.0
  crypto: ^3.0.3
  flutter_dotenv: ^6.0.1
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  path: ^1.9.1
  image: ^4.9.2
  intl: ^0.20.3
  geolocator: ^14.0.3
  shared_preferences: ^2.5.5
  geolocator_web: ^4.1.4
  table_calendar: ^3.2.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
